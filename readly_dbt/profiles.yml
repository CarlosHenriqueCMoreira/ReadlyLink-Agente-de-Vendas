readly_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'readly_link') }}"
      user: "{{ env_var('POSTGRES_USER', 'readly') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
